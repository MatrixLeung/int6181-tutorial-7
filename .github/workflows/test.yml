name: Run Test
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: CheckOut Your Code
        uses: actions/checkout@v5
      - name: Set Up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run teacher tests
        run: python -m unittest discover -v
